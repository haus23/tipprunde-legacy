<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Tipprunde der Haus23 Freunde" />
    <meta name="color-scheme" content="light dark">
    <title id="static-title">runde.tips</title>
    <script>
      // Color scheme before the first paint: a stored choice wins, otherwise
      // follow the system, also when it changes later (see utils/theme.ts).
      (() => {
        const system = matchMedia('(prefers-color-scheme: dark)');
        const apply = () => {
          let stored = null;
          try {
            stored = localStorage.getItem('colorScheme');
          } catch {}
          document.documentElement.classList.toggle(
            'dark',
            stored ? stored === 'dark' : system.matches,
          );
        };
        apply();
        system.addEventListener('change', apply);
      })();
    </script>
    <link rel="stylesheet" href="/app/styles/tailwind.css" />
    <!-- Load the main font with the page, so the first text does not swap fonts -->
    <link
      rel="preload"
      href="./node_modules/@fontsource-variable/geist/files/geist-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="preconnect" href="https://unterbau.runde.tips" />
  </head>
  <body class="relative bg-background text-foreground antialiased">
    <div id="root" class="isolate"></div>
    <script type="module" src="/app/entry.client.tsx"></script>
  </body>
</html>
