packages:
  - 'packages/*'
  - 'apps/*'

catalog:
  typescript: ~7.0.2

catalogs:
  icons:
    lucide-react: ^1.72.0
  react:
    '@types/react': ^19.3.0
    '@types/react-dom': ^19.3.0
    react: ^19.3.1
    react-dom: ^19.3.1
  styling:
    '@tailwindcss/vite': ^4.3.5
    cn: ^0.5.2
    tailwindcss: ^4.3.5
  toolchain:
    '@vitejs/plugin-react': ^6.3.0
    vite: ^8.3.8
    vitest: ^5.1.0
  ui:
    '@base-ui/react': ^1.9.0
  validation:
    valibot: ^1.5.0

autoDedupe: true

lockfile:
  includeResolutionSettings: true

allowBuilds:
  '@firebase/util': true
  esbuild: true
  protobufjs: true

permissions:
  '@tanstack/react-router':
    skills: true
  '@tanstack/router-plugin':
    skills: true
